<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Μεγιστοποίηση κέρδους: P = MC</title><style>body{font-family:Arial,sans-serif;background:white;color:#17212d;margin:0;padding:18px}.wrap{max-width:1050px;margin:auto}h2{text-align:center;margin:4px 0 8px}p{text-align:center;color:#475569}.controls{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:12px}input{width:260px}svg{width:100%;height:auto;border:1px solid #e2e8f0;border-radius:12px}.note{background:#f1f5f9;padding:12px;border-radius:10px;margin-top:12px;text-align:center}.foot{text-align:center;font-size:12px;color:#475569;margin-top:14px}button{padding:8px 14px;background:#e2e8f0;border:0;border-radius:7px;cursor:pointer}</style></head><body><div class="wrap"><h2>Μεγιστοποίηση κέρδους: P = MC</h2><p>Επιχείρηση σε πλήρη ανταγωνισμό — τομή της τιμής με το αυξανόμενο οριακό κόστος</p><div class="controls"><label for="price">Τιμή (P): <strong id="pv">45</strong></label><input id="price" type="range" min="15" max="90" value="45" step="1"><button id="reset">Επαναφορά</button></div><svg viewBox="0 0 900 540" role="img" aria-label="Διαδραστικό διάγραμμα τιμής και οριακού κόστους"><g id="plot"></g></svg><div class="note" id="explain"></div><div class="foot">Επιμέλεια: Τσακμάκης Χρήστος, Οικονομολόγος εκπαιδευτικός, MSc</div></div><script>const svg=document.getElementById('plot'),p=document.getElementById('price'),pv=document.getElementById('pv'),ex=document.getElementById('explain');const NS='http://www.w3.org/2000/svg';function el(tag,attrs={},txt){let n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(txt!==undefined)n.textContent=txt;return n}const x0=95,y0=460,w=710,h=370,x=q=>x0+q/100*w,y=v=>y0-v/100*h;function mc(q){return 10+0.008*q*q}function draw(){const P=+p.value;pv.textContent=P;const q=Math.sqrt((P-10)/.008);const g=document.getElementById('plot');g.replaceChildren();g.append(el('line',{x1:x0,y1:y0,x2:840,y2:y0,stroke:'#111','stroke-width':2.5}),el('line',{x1:x0,y1:y0,x2:x0,y2:55,stroke:'#111','stroke-width':2.5}));g.append(el('polygon',{points:'840,460 826,454 826,466',fill:'#111'}),el('polygon',{points:'95,55 89,69 101,69',fill:'#111'}));g.append(el('text',{x:845,y:486,'font-size':19,fill:'#111'},'Q'),el('text',{x:57,y:53,'font-size':19,fill:'#111'},'P, MC'),el('text',{x:79,y:481,'font-size':15},'0'));let d='';for(let i=15;i<=100;i++){const xx=x(i),yy=y(mc(i));d+=(i>15?' L':'M')+xx+' '+yy}g.append(el('path',{d,fill:'none',stroke:'#0754d6','stroke-width':3.5,'stroke-linecap':'round','stroke-linejoin':'round'}));g.append(el('text',{x:x(101),y:y(mc(92))-15,fill:'#0754d6','font-size':26,'font-weight':800},'MC'));g.append(el('line',{x1:x0,y1:y(P),x2:x(100),y2:y(P),stroke:'#dc2626','stroke-width':3.5}));g.append(el('text',{x:x(101),y:y(P)-9,fill:'#dc2626','font-size':21,'font-weight':700},'P'));g.append(el('line',{x1:x(q),y1:y(P),x2:x(q),y2:y0,stroke:'#111','stroke-dasharray':'8 6','stroke-width':1.8}),el('line',{x1:x0,y1:y(P),x2:x(q),y2:y(P),stroke:'#111','stroke-dasharray':'8 6','stroke-width':1.5}));g.append(el('circle',{cx:x(q),cy:y(P),r:7,fill:'#16a34a',stroke:'#fff','stroke-width':2}));g.append(el('text',{x:x(q)+12,y:y(P)-13,'font-size':20,'font-weight':700,fill:'#15803d'},'Ισορροπία: P = MC'));g.append(el('text',{x:x(q),y:y0+28,'text-anchor':'middle','font-size':19,'font-weight':700},'Q* = '+q.toFixed(1)));g.append(el('text',{x:x0-15,y:y(P)+6,'text-anchor':'end','font-size':17},String(P)));ex.innerHTML='Για τιμή <b>P = '+P+'</b>, η επιλεγμένη ποσότητα είναι <b>Q* ≈ '+q.toFixed(1)+'</b>, όπου <b>P = MC</b> και το MC είναι αυξανόμενο.<br><small>Το διάγραμμα δείχνει τη συνθήκη πρώτης τάξης. Για την απόφαση παραγωγής στη βραχυχρόνια περίοδο απαιτείται και έλεγχος της σχέσης P με το AVC.</small>'}p.addEventListener('input',draw);document.getElementById('reset').addEventListener('click',()=>{p.value=45;draw()});draw();</script></body></html>
