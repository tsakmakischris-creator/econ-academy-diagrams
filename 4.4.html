<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Γραμμική προσφορά — τρεις περιπτώσεις γ</title><style>
:root{font-family:Arial,'Segoe UI',sans-serif;color:#142238;background:#fff}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1440px;margin:auto}h1{text-align:center;font-size:25px;margin:0 0 8px;color:#152b4d}.intro{text-align:center;margin:0 0 20px;font-size:16px}.controls{display:flex;justify-content:center;align-items:center;gap:24px;flex-wrap:wrap;padding:12px;background:#f3f7fc;border:1px solid #d8e3ef;border-radius:12px;margin-bottom:16px}.controls label{display:flex;align-items:center;gap:10px;font-size:15px}.controls input{width:140px;accent-color:#2465cf}.panels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.panel{border:1px solid #dce4ed;border-radius:12px;padding:12px 10px 14px;min-width:0;background:#fff}.panel h2{text-align:center;font-size:20px;margin:4px 0 6px;color:#193a69}.panel .eq{text-align:center;color:#37465c;font-size:16px;margin:0 0 5px;font-weight:600}.panel svg{width:100%;height:auto;display:block}.result{text-align:center;font-size:14px;min-height:42px;margin:4px 0 0}.note{font-size:14px;text-align:center;margin:18px 0 8px;color:#435168}.credit{text-align:center;font-size:12px;color:#687488;margin:14px 0 0}.controls button{background:#fff;border:1px solid #bacbe0;border-radius:8px;padding:8px 12px;cursor:pointer;color:#1c3d70;font-weight:600}svg text{font-family:Arial,'Segoe UI',sans-serif}@media(max-width:780px){body{padding:8px}.panels{gap:4px}.panel{padding:7px 2px}.panel h2{font-size:15px}.panel .eq{font-size:12px}.result{font-size:11px}.intro{font-size:13px}h1{font-size:19px}.controls{gap:8px}.controls label{font-size:12px}.controls input{width:100px}}@media print{body{padding:8px}.controls{display:none}}
</style></head><body><main><h1>Γραμμική καμπύλη προσφοράς</h1><p class="intro">Q<sub>S</sub> = γ + δP &nbsp; | &nbsp; δ &gt; 0 — Ποιον άξονα τέμνει η καμπύλη S;</p><div class="controls"><label>Μέτρο του γ: <input id="magnitude" type="range" min="1" max="6" step="0.5" value="3"><strong id="magval">3</strong></label><label>Κλίση δ: <input id="slope" type="range" min="0.5" max="2" step="0.1" value="1"><strong id="slopeval">1</strong></label><button id="toggle" type="button">Απόκρυψη σημείων τομής</button></div><section class="panels"><article class="panel"><h2>γ &lt; 0</h2><p class="eq" id="eq-neg"></p><svg id="neg" viewBox="0 0 390 360" role="img" aria-label="Καμπύλη προσφοράς που τέμνει τον άξονα P"></svg><p class="result" id="result-neg"></p></article><article class="panel"><h2>γ &gt; 0</h2><p class="eq" id="eq-pos"></p><svg id="pos" viewBox="0 0 390 360" role="img" aria-label="Καμπύλη προσφοράς που τέμνει τον άξονα Qs"></svg><p class="result" id="result-pos"></p></article><article class="panel"><h2>γ = 0</h2><p class="eq" id="eq-zero"></p><svg id="zero" viewBox="0 0 390 360" role="img" aria-label="Καμπύλη προσφοράς που διέρχεται από την αρχή των αξόνων"></svg><p class="result" id="result-zero"></p></article></section><p class="note">Η μεταβολή του γ μετατοπίζει την καμπύλη. Η μεταβολή του δ αλλάζει την κλίση της. Και στις τρεις περιπτώσεις ισχύει δ &gt; 0.</p><p class="credit">Επιμέλεια: Τσακμάκης Χρήστος, Οικονομολόγος εκπαιδευτικός, MSc</p></main><script>
(()=>{'use strict';const ns='http://www.w3.org/2000/svg';const mag=document.getElementById('magnitude'),slope=document.getElementById('slope');let show=true;const create=(name,attrs={},text)=>{const e=document.createElementNS(ns,name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e};const fmt=n=>Number(n.toFixed(2)).toLocaleString('el-GR',{maximumFractionDigits:2});function render(id,g,d){const svg=document.getElementById(id);svg.replaceChildren();const x0=53,y0=303,w=300,h=250;const xmax=14,pmax=14;const X=q=>x0+q/xmax*w,Y=p=>y0-p/pmax*h;const add=(name,a,t)=>svg.appendChild(create(name,a,t));add('line',{x1:x0,y1:y0,x2:370,y2:y0,stroke:'#111827','stroke-width':2.5});add('line',{x1:x0,y1:y0,x2:x0,y2:35,stroke:'#111827','stroke-width':2.5});add('path',{d:'M370 303 l-10 -5 v10 z',fill:'#111827'});add('path',{d:'M53 35 l-5 10 h10 z',fill:'#111827'});add('text',{x:369,y:330,'text-anchor':'end','font-size':19,'font-weight':700,fill:'#111827'},'Qs');add('text',{x:31,y:29,'font-size':19,'font-weight':700,fill:'#111827'},'P');add('text',{x:40,y:323,'font-size':13,fill:'#334155'},'0');const pStart=Math.max(0,-g/d),pEnd=Math.min(pmax,(xmax-g)/d);if(pEnd>pStart){add('line',{x1:X(g+d*pStart),y1:Y(pStart),x2:X(g+d*pEnd),y2:Y(pEnd),stroke:'#2164cc','stroke-width':4.2,'stroke-linecap':'round'});const labelP=Math.min(pEnd-0.3,Math.max(pStart+1.3,(pStart+pEnd)/2+2));add('text',{x:X(g+d*labelP)+9,y:Y(labelP)-8,fill:'#1652ae','font-size':22,'font-weight':700},'S')}
const iq=g>0?g:0,ip=g<0?-g/d:0;if(show){add('circle',{cx:X(iq),cy:Y(ip),r:5.5,fill:'#e27d19',stroke:'#fff','stroke-width':1.5});if(g<0){add('line',{x1:x0,y1:Y(ip),x2:X(1.7),y2:Y(ip),stroke:'#333','stroke-dasharray':'5 4'});add('text',{x:62,y:Y(ip)-12,'font-size':14,fill:'#ad560c','font-weight':700},'P₀ = '+fmt(ip))}else if(g>0){add('line',{x1:X(iq),y1:Y(1.5),x2:X(iq),y2:y0,stroke:'#333','stroke-dasharray':'5 4'});add('text',{x:X(iq)+5,y:326,'font-size':14,fill:'#ad560c','font-weight':700},'γ = '+fmt(g))}else{add('text',{x:65,y:289,'font-size':13,fill:'#ad560c','font-weight':700},'(0, 0)')}}
const desc=g<0?'Τέμνει τον άξονα P στο P = '+fmt(ip):g>0?'Τέμνει τον άξονα Qs στο Qs = '+fmt(g):'Διέρχεται από την αρχή των αξόνων (0, 0)';document.getElementById('result-'+id).textContent=desc}
function update(){const a=+mag.value,d=+slope.value;document.getElementById('magval').textContent=fmt(a);document.getElementById('slopeval').textContent=fmt(d);document.getElementById('eq-neg').textContent='Qs = −'+fmt(a)+' + '+fmt(d)+'P';document.getElementById('eq-pos').textContent='Qs = '+fmt(a)+' + '+fmt(d)+'P';document.getElementById('eq-zero').textContent='Qs = '+fmt(d)+'P';render('neg',-a,d);render('pos',a,d);render('zero',0,d)}mag.addEventListener('input',update);slope.addEventListener('input',update);document.getElementById('toggle').addEventListener('click',e=>{show=!show;e.target.textContent=show?'Απόκρυψη σημείων τομής':'Εμφάνιση σημείων τομής';update()});update()})();
</script></body></html>
